<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#bd6680">
    <title>Chatbot AI</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
  </head>
  <body>
    <main class="chat-card" aria-label="Chatbot AI">
      <header class="chat-header">
        <h1>Chatbot AI</h1>
        <p>NVIDIA Nemotron 3 Ultra</p>
      </header>

      <section class="chat-messages" id="chat-messages" aria-live="polite" aria-label="Percakapan">
        <div class="message message-assistant">Halo! Ada yang bisa saya bantu?</div>
      </section>

      <form class="chat-form" id="chat-form">
        <label class="sr-only" for="message-input">Ketik pesan</label>
        <input
          id="message-input"
          name="message"
          type="text"
          placeholder="Ketik pesan..."
          autocomplete="off"
          required
        >
        <button id="send-button" type="submit">Kirim</button>
      </form>
    </main>
  </body>
</html>
